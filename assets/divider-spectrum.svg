<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="36" viewBox="0 0 1200 36" role="img" aria-labelledby="title desc">
  <title id="title">Animated spectrum divider</title>
  <desc id="desc">A six-color retail intelligence spectrum slides across a dark base.</desc>
  <defs>
    <linearGradient id="spectrum" x1="0" x2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.2" stop-color="#8B5CF6"/>
      <stop offset="0.4" stop-color="#EC4899"/>
      <stop offset="0.6" stop-color="#F59E0B"/>
      <stop offset="0.8" stop-color="#10B981"/>
      <stop offset="1" stop-color="#22D3EE"/>
      <animate attributeName="x1" values="0;1;0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-300%" width="120%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="36" fill="#07111F"/>
  <path d="M20 18H1180" stroke="url(#spectrum)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M80 10V26M240 10V26M400 10V26M560 10V26M720 10V26M880 10V26M1040 10V26" stroke="#E6F7FF" stroke-opacity="0.6" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.15;0.8;0.15" dur="2s" repeatCount="indefinite"/>
  </path>
</svg>
