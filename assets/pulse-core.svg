<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180" role="img" aria-labelledby="title desc">
  <title id="title">Pulsing warehouse intelligence core</title>
  <desc id="desc">A central data core emits colored verification pulses.</desc>
  <defs>
    <radialGradient id="field">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#07111F" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="180" rx="22" fill="#07111F"/>
  <circle cx="320" cy="90" r="70" fill="url(#field)">
    <animate attributeName="r" values="45;78;45" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;1;0.45" dur="3s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" filter="url(#glow)">
    <circle cx="320" cy="90" r="24" stroke="#22D3EE" stroke-width="3">
      <animate attributeName="r" values="22;30;22" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="90" r="46" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="8 7">
      <animateTransform attributeName="transform" type="rotate" from="0 320 90" to="360 320 90" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
  <path d="M30 90H240M400 90H610" stroke="#10B981" stroke-width="2" stroke-dasharray="12 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.4s" repeatCount="indefinite"/>
  </path>
  <text x="320" y="96" text-anchor="middle" fill="#E6F7FF" font-family="monospace" font-size="17" letter-spacing="3">VERIFIED</text>
</svg>
