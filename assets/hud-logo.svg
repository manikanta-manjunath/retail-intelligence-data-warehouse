<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Retail Intelligence animated HUD logo</title>
  <desc id="desc">Rotating neon data rings surrounding a warehouse intelligence core.</desc>
  <defs>
    <radialGradient id="core" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#E26D5C" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#AA5551" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#472D30" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E26D5C"/>
      <stop offset="0.33" stop-color="#AA5551"/>
      <stop offset="0.66" stop-color="#F1A782"/>
      <stop offset="1" stop-color="#C9CBA3"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="240" height="240" rx="28" fill="#472D30"/>
  <circle cx="120" cy="120" r="90" fill="url(#core)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" filter="url(#glow)" transform-origin="120px 120px">
    <circle cx="120" cy="120" r="82" stroke="#E26D5C" stroke-width="2" stroke-dasharray="16 8 2 8">
      <animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="120" r="65" stroke="#AA5551" stroke-width="3" stroke-dasharray="8 12">
      <animateTransform attributeName="transform" type="rotate" from="360 120 120" to="0 120 120" dur="8s" repeatCount="indefinite"/>
    </circle>
    <path d="M120 38 A82 82 0 0 1 202 120" stroke="url(#ring)" stroke-width="5" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="10 250;130 130;10 250" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
  <g stroke="#E26D5C" stroke-width="1" opacity="0.45">
    <path d="M120 20V54M120 186V220M20 120H54M186 120H220"/>
    <path d="M49 49L72 72M168 168L191 191M191 49L168 72M72 168L49 191"/>
  </g>
  <g transform="translate(73 76)" filter="url(#glow)">
    <path d="M8 34L47 10L86 34V80H8Z" fill="#723D46" stroke="#E26D5C" stroke-width="2"/>
    <path d="M20 39H74V72H20Z" fill="none" stroke="#AA5551" stroke-width="2"/>
    <path d="M30 47H64M30 56H64M30 65H64" stroke="#C9CBA3" stroke-width="2">
      <animate attributeName="stroke" values="#C9CBA3;#EA8A6F;#E26D5C;#C9CBA3" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle cx="120" cy="120" r="6" fill="#EA8A6F" filter="url(#glow)">
    <animate attributeName="r" values="4;8;4" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
