<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-labelledby="title desc">
  <title id="title">Floating data particles</title>
  <desc id="desc">Colored particles drift across a dark retail intelligence data field.</desc>
  <defs>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="180" rx="18" fill="#472D30"/>
  <g filter="url(#glow)">
    <circle cx="80" cy="130" r="4" fill="#E26D5C"><animate attributeName="cy" values="150;25;150" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="60" r="3" fill="#AA5551"><animate attributeName="cy" values="155;20;155" dur="7s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="120" r="5" fill="#F1A782"><animate attributeName="cy" values="160;35;160" dur="5.5s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="85" r="4" fill="#EA8A6F"><animate attributeName="cy" values="150;18;150" dur="6.8s" begin="-4s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="145" r="3" fill="#C9CBA3"><animate attributeName="cy" values="160;30;160" dur="5.9s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="55" r="5" fill="#E26D5C"><animate attributeName="cy" values="155;22;155" dur="7.4s" begin="-5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="118" r="4" fill="#AA5551"><animate attributeName="cy" values="158;28;158" dur="6.2s" begin="-2.5s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="78" r="3" fill="#F1A782"><animate attributeName="cy" values="152;24;152" dur="5.2s" begin="-1.8s" repeatCount="indefinite"/></circle>
  </g>
  <path d="M20 145 C180 100 300 165 450 100 S720 40 880 92" fill="none" stroke="#E26D5C" stroke-opacity="0.16" stroke-dasharray="6 12">
    <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="4s" repeatCount="indefinite"/>
  </path>
</svg>
